version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: security_scanner_db
    restart: always
    environment:
      MYSQL_DATABASE: model_security_scanner
      MYSQL_USER: scanner_user
      MYSQL_PASSWORD: scanner_password_2026
      MYSQL_ROOT_PASSWORD: root_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
